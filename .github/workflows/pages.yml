# Build the browser demo and publish it to GitHub Pages.
#
# Separate from "tests" on purpose: a failing test must not publish, and a Pages outage must not
# read as a test failure. It runs only when the page or the design it plays changes, so editing
# REPORT.md does not redeploy the site.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "slotmath/designs.json" # the page plays the fitted design; a refit changes it
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web
      - name: Typecheck and build
        run: npm run build
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
