# Lint and test on every push to main and every pull request. The slow tests (a 10^8-spin
# agreement run and an exhaustive check of every fitted design) run on demand: Actions tab,
# "tests", "Run workflow", tick "slow".
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      slow:
        description: "Also run the slow tests"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]   # 3.11 is the lowest pyproject.toml allows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check slotmath tests
      - name: Fast tests
        if: ${{ !inputs.slow }}
        run: pytest -q -m "not slow"
      - name: All tests
        if: ${{ inputs.slow }}
        run: pytest -q

  # The browser demo's evaluator, checked against totals `slotmath/webfixture.py` recorded from
  # the Python one. Same two tiers as above: 20,000 spins on every push, a million on demand.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web
      - name: Typecheck and build
        run: npm run build
        working-directory: web
      - name: Fast tests
        if: ${{ !inputs.slow }}
        run: npm test
        working-directory: web
      - name: All tests
        if: ${{ inputs.slow }}
        run: npm test && npm run test:slow
        working-directory: web
